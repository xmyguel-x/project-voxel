<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" width="1200" height="46" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170a33"/>
      <stop offset="38%" stop-color="#2e1155"/>
      <stop offset="62%" stop-color="#1a0b36"/>
      <stop offset="100%" stop-color="#0a0418"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7b2fd6" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#4a1a8a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf5" stop-opacity="1"/>
      <stop offset="28%" stop-color="#ffe9a8" stop-opacity="0.80"/>
      <stop offset="62%" stop-color="#f7c04a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f7c04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#6b2fd0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b2fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLogo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="35%" stop-color="#fff4cd"/>
      <stop offset="62%" stop-color="#f7c04a"/>
      <stop offset="100%" stop-color="#a75c10"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7d4ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e7d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0522"/>
      <stop offset="100%" stop-color="#160a30"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigblur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect width="4" height="1.4" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>
<line x1="0" y1="23.0" x2="470" y2="23.0" stroke="#f7c04a" stroke-width="1.6" opacity="0.7"/><line x1="730" y1="23.0" x2="1200" y2="23.0" stroke="#f7c04a" stroke-width="1.6" opacity="0.7"/><polygon points="600,11.0 614,23.0 600,35.0 586,23.0" fill="none" stroke="#f7c04a" stroke-width="1.6" opacity="0.9"/><polygon points="600,18.0 607,23.0 600,28.0 593,23.0" fill="#f7c04a" opacity="0.9"/><rect width="1200" height="46" fill="url(#scan)" opacity="0.3"/></svg>